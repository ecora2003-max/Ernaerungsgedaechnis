name: Android device E2E (offline)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/src/androidTest/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/recipe-android-device.yml'
permissions:
  contents: read
concurrency:
  group: recipe-device-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recipe-device:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle.kts
            gradle.properties
            gradle/wrapper/gradle-wrapper.properties
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
      - name: Enable emulator KVM
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Execute shopping/recipe UI, Room restart and bundled OCR offline
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            chmod +x gradlew
            # Ephemeral emulator only: exercise Android's real credential Activity
            # and auth-bound Keystore, never a synthetic RESULT_OK callback.
            adb shell locksettings set-pin 2468
            # Keep the API 35 emulator awake while Gradle builds the test APKs.
            # After provisioning a PIN, explicitly dismiss any newly displayed
            # lock screen before instrumentation launches MainActivity. Otherwise
            # Compose has no visible hierarchy and credential UI tests time out.
            adb shell settings put system screen_off_timeout 1800000
            adb shell svc power stayon true
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell input keyevent KEYCODE_MENU
            adb shell input swipe 540 1700 540 400 250
            adb shell input text 2468
            adb shell input keyevent KEYCODE_ENTER
            adb shell input keyevent KEYCODE_HOME
            adb shell svc wifi disable
            adb shell svc data disable
            # Preserve the actual foreground/lock state when any UI test fails.
            # These artifacts contain only this ephemeral synthetic test device.
            set +e
            ./gradlew --no-daemon --max-workers=2 :app:connectedDebugAndroidTest
            test_result=$?
            if [ "$test_result" -ne 0 ]; then
              mkdir -p app/build/outputs/device-diagnostics
              adb shell dumpsys window > app/build/outputs/device-diagnostics/window.txt
              adb exec-out screencap -p > app/build/outputs/device-diagnostics/screen.png
            fi
            exit "$test_result"
      - name: Upload instrumentation evidence only (no downloadable APK)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recipe-android-device-e2e-results
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            app/build/outputs/device-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
