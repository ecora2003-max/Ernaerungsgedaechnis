name: Android device E2E (offline + privacy)
on:
  workflow_dispatch:
    inputs:
      test_class:
        description: 'Optional: einzelne Instrumentation-Testklasse für gezielte Fehlerprüfung'
        required: false
        default: ''
        type: string
  pull_request:
    paths:
      - 'app/src/androidTest/**'
      - 'app/src/main/**'
      - 'build.gradle.kts'
      - 'gradle/wrapper/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/recipe-android-device.yml'
      - 'tools/run_android_device_tests.sh'
permissions:
  contents: read
concurrency:
  group: recipe-device-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recipe-device:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle.kts
            gradle.properties
            gradle/wrapper/gradle-wrapper.properties
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Enable emulator KVM
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Compile instrumentation APKs before starting the emulator
        # These are the same APKs connectedDebugAndroidTest installs. Keep the
        # heavy compiler off the emulator's boot/launcher CPU time, no upload.
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Execute shopping/recipe UI, Room restart and bundled OCR offline
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          EG_ANDROID_TEST_CLASS: ${{ inputs.test_class }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front none
          script: |
            chmod +x gradlew
            # Ephemeral emulator only: exercise Android's real credential Activity
            # and auth-bound Keystore, never a synthetic RESULT_OK callback.
            adb shell locksettings set-pin 2468
            # Keep the API 35 emulator awake throughout instrumentation.
            # After provisioning a PIN, explicitly dismiss any newly displayed
            # lock screen before instrumentation launches MainActivity. Otherwise
            # Compose has no visible hierarchy and credential UI tests time out.
            adb shell settings put system screen_off_timeout 1800000
            adb shell svc power stayon true
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell cmd connectivity airplane-mode enable
            adb shell svc wifi disable
            adb shell svc data disable
            bash tools/run_android_device_tests.sh
      - name: Upload instrumentation evidence only (no downloadable APK)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recipe-android-device-e2e-results
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            app/build/outputs/device-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
  api26-core:
    # Verify the declared minSdk on its actual older Android/SQLite runtime.
    # This is a bounded core smoke, independently of the full API 35 suite.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_class == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle.kts
            gradle.properties
            gradle/wrapper/gradle-wrapper.properties
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Enable emulator KVM
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Compile instrumentation APKs before starting the emulator
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Execute actual API 26 core UI and persistent Room flows offline
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          EG_ANDROID_TEST_CLASS: de.ernaehrung.demo.PlanExecutionOnDeviceTest,de.ernaehrung.demo.NutritionDayConfirmationOnDeviceTest,de.ernaehrung.demo.StockOverviewOnDeviceTest,de.ernaehrung.demo.PublishedDatabaseMigrationOnDeviceTest
          EG_ANDROID_TEST_TIMEOUT: 10m
        with:
          api-level: 26
          target: google_apis
          arch: x86
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            chmod +x gradlew
            adb shell locksettings set-pin 2468
            adb shell settings put system screen_off_timeout 1800000
            adb shell svc power stayon true
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell settings put global airplane_mode_on 1
            # API 26 denies the protected AIRPLANE_MODE broadcast to adb shell.
            # Disable both transports directly; every selected test independently
            # asserts ConnectivityManager.activeNetwork == null before and after.
            adb shell svc wifi disable
            adb shell svc data disable
            mkdir -p app/build/outputs/device-diagnostics
            adb shell getprop ro.build.version.sdk > app/build/outputs/device-diagnostics/api26-platform.txt
            bash tools/run_android_device_tests.sh
      - name: Verify actual API and all four original device test results
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          assert Path('app/build/outputs/device-diagnostics/api26-platform.txt').read_text().strip() == '26'
          reports = list(Path('app/build/outputs/androidTest-results/connected').rglob('TEST-*.xml'))
          assert reports, 'No original instrumentation XML'
          suites = [ET.parse(path).getroot() for path in reports]
          assert sum(int(s.get('tests', '0')) for s in suites) == 4
          assert all(int(s.get(field, '0')) == 0 for s in suites for field in ('failures', 'errors', 'skipped'))
          classes = {t.get('classname') for s in suites for t in s.findall('testcase')}
          expected = {'de.ernaehrung.demo.' + name for name in (
              'PlanExecutionOnDeviceTest', 'NutritionDayConfirmationOnDeviceTest', 'StockOverviewOnDeviceTest',
              'PublishedDatabaseMigrationOnDeviceTest')}
          assert classes == expected, (classes, expected)
          print('ANDROID_API26_CORE_PASS: actual SDK 26; 4/4; 0 failures/errors/skips')
          PY
      - name: Upload original API 26 evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-api26-core-results
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            app/build/outputs/device-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
