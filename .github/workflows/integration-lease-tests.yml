name: Integration lease policy tests

on:
  pull_request:
    paths:
      - "tools/renew_integration_lease.py"
      - "tools/test_renew_integration_lease.py"
      - ".github/workflows/integration-lease-renewal.yml"
      - ".github/workflows/integration-lease-tests.yml"
      - "Prüfe mich ob du dran bist und was du machen sollst und darfst.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check lease invariants
        run: python3 -m unittest -v tools/test_renew_integration_lease.py
