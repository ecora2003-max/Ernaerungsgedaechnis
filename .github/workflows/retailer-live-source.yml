name: Public retailer live Android source
on:
  pull_request:
    paths:
      - 'app/src/main/assets/reviewed-live-offer-sources.v1.json'
      - 'app/src/main/java/de/ernaehrung/demo/data/offers/**'
      - 'app/src/main/java/de/ernaehrung/demo/ui/LiveOffersViewModel.kt'
      - 'app/src/main/java/de/ernaehrung/demo/ui/screens/LiveOffersScreen.kt'
      - 'app/src/main/java/de/ernaehrung/demo/ui/screens/LiveOfferMarketComparison.kt'
      - 'app/src/androidTest/java/de/ernaehrung/demo/PublicRetailerLiveOnDeviceTest.kt'
      - 'app/src/androidTest/java/de/ernaehrung/demo/PublicChainLiveFlow.kt'
      - 'app/src/androidTest/java/de/ernaehrung/demo/DeviceTestPreparation.kt'
      - 'app/src/androidTest/java/de/ernaehrung/demo/SyntheticPersistenceInstrumentation.kt'
      - '.github/workflows/retailer-live-source.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: retailer-live-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-penny-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EG_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle.kts
            gradle.properties
            gradle/wrapper/gradle-wrapper.properties
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Check the same public origin from the runner without a response archive
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          from urllib.request import Request,urlopen
          from urllib.robotparser import RobotFileParser
          ua='Ernaehrungsgedaechtnis public-offers (+https://github.com/ecora2003-max/Ernaerungsgedaechnis)'
          url='https://www.penny.de/.rest/market'
          with urlopen(Request('https://www.penny.de/robots.txt',headers={'User-Agent':ua}),timeout=25) as reply:
              robot=reply.read(300000).decode('utf8')
          rules=RobotFileParser();rules.parse(robot.splitlines());assert rules.can_fetch(ua,url)
          with urlopen(Request(url,headers={'User-Agent':ua,'Accept':'application/json'}),timeout=25) as reply:
              payload=reply.read(6291457);assert len(payload)<=6291456
              rows=json.loads(payload);selected=[r for r in rows if r.get('wwIdent')=='4030085'];assert len(selected)==1
              evidence={'status':reply.status,'bytes':len(payload),'sha256':hashlib.sha256(payload).hexdigest(),'canonicalMarketId':'4030085','robotsAllowed':True}
          target=Path('app/build/outputs/live-source-evidence');target.mkdir(parents=True,exist_ok=True)
          (target/'runner-origin.json').write_text(json.dumps(evidence)+'\n')
          print('RUNNER_PUBLIC_ORIGIN',json.dumps(evidence))
          PY
      - name: Compile the actual production and instrumentation APKs
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Read the public source through the production Android UI
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb shell settings put system screen_off_timeout 1800000
            adb shell svc power stayon true
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell cmd connectivity airplane-mode disable
            adb shell svc wifi enable
            adb shell svc data disable
            mkdir -p app/build/outputs/live-source-evidence
            ./gradlew --no-daemon --max-workers=2 :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=de.ernaehrung.demo.PublicRetailerLiveOnDeviceTest -Pandroid.testInstrumentationRunnerArguments.eg_live_source=true -Pandroid.testInstrumentationRunnerArguments.source_sha=$EG_SOURCE_COMMIT || touch app/build/outputs/retailer-live-test-failed
            adb pull /sdcard/Download/eg-public-retailer-live app/build/outputs/live-source-evidence/device
            test ! -e app/build/outputs/retailer-live-test-failed
      - name: Verify live metadata, exact source and original executed test
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          import xml.etree.ElementTree as E
          root=Path('app/build/outputs/live-source-evidence')
          proof=json.loads((root/'device/proof.json').read_text())
          assert proof['status']=='PASS' and proof['format']=='EG_REAL_PUBLIC_RETAILER_UI_V1'
          assert proof['sourceCommit']==os.environ['EG_SOURCE_COMMIT'] and proof['actualSdk']==35
          assert proof['actualNetworkValidated'] and proof['defaultProductionHttp'] and proof['actualFactsUnchanged']
          assert proof['sourceRepliesInjected'] is False and 0<proof['offerCount']<=256
          assert proof['uidRxDelta']>0 and proof['uidTxDelta']>0
          assert proof['sourceHost']=='www.penny.de' and proof['storeId']=='4030085'
          expected={'ALDI_NORD':('www.aldi-nord.de',None),'ALDI_SUED':('www.aldi-sued.de',None),
                    'KAUFLAND':('filiale.kaufland.de','DE5220'),'REWE':('www.rewe.de','1356345')}
          sources=[]
          for retailer,(host,store) in expected.items():
              source=json.loads((root/f'device/market-{retailer}.json').read_text())
              assert source['format']=='EG_REAL_PUBLIC_CHAIN_UI_V1' and source['status']=='PASS'
              assert source['retailer']==retailer and source['sourceCommit']==os.environ['EG_SOURCE_COMMIT']
              assert source['actualSdk']==35 and source['actualNetworkValidated'] and source['actualFactsUnchanged']
              assert source['sourceHost']==host and source['storeId']==store and source['branchConfirmed']==(store is not None)
              assert source['productSearch']==(retailer=='REWE')
              assert source['defaultProductionHttp'] and source['sourceRepliesInjected'] is False
              assert source['uidRxDelta']>0 and source['uidTxDelta']>0
              assert 0<source['offerCount']<=(512 if retailer=='ALDI_NORD' else 256)
              sources.append(source)
          reports=list(Path('app/build/outputs/androidTest-results/connected').rglob('TEST-*.xml'))
          suites=[E.parse(p).getroot() for p in reports]
          assert sum(int(s.get('tests',0)) for s in suites)==1+len(expected)
          assert all(int(s.get(k,0))==0 for s in suites for k in ('failures','errors','skipped'))
          for label,path in [('subject','app/build/outputs/apk/debug/app-debug.apk'),('test','app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk')]:
              proof[label+'ApkSha256']=hashlib.sha256(Path(path).read_bytes()).hexdigest()
          (root/'bound-proof.json').write_text(json.dumps(proof,indent=2)+'\n')
          for source in sources:
              source.update({key:proof[key] for key in ('subjectApkSha256','testApkSha256')})
              (root/f"bound-{source['retailer']}.json").write_text(json.dumps(source,indent=2)+'\n')
          print('REAL_PUBLIC_RETAILER_UI_PASS',json.dumps(proof))
          PY
      - name: Upload original evidence only; no supplier response archive or APK
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-retailer-live-android-results
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            app/build/outputs/live-source-evidence/
          retention-days: 7
          if-no-files-found: ignore
