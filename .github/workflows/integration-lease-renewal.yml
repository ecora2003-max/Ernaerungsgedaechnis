name: Integration lease coordination safety tests

# Intentionally NO workflow_run trigger and NO GitHub write token.
# GitHub CI cannot query whether a ChatGPT automation is still running.
# Renewal on a matching branch can outlive the owner; explicit owner CAS
# heartbeats and verified automation-run recovery are required instead.
on:
  pull_request:
    paths:
      - ".github/workflows/integration-lease-renewal.yml"
      - "tools/renew_integration_lease.py"
      - "tools/recover_integration_lease.py"
      - "tools/test_renew_integration_lease.py"
      - "tools/test_recover_integration_lease.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/integration-lease-renewal.yml"
      - "tools/renew_integration_lease.py"
      - "tools/recover_integration_lease.py"
      - "tools/test_renew_integration_lease.py"
      - "tools/test_recover_integration_lease.py"

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout unprivileged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify lease safety invariants
        run: python3 -m unittest discover -s tools -p 'test_*integration_lease.py' -v
