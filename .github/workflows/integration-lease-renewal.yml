name: Integration lease auto-renew

# A workflow_run uses trusted code from the default branch. Never execute the
# triggering PR branch with the write-capable token.
on:
  workflow_run:
    workflows: ["Android checks and optional APK"]
    types: [requested, completed]

permissions:
  contents: write

concurrency:
  group: integration-lease-renewal
  cancel-in-progress: false

jobs:
  renew:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != 'main' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Checkout ONLY trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - name: Verify safety regression cases
        run: python3 -m unittest tools/test_renew_integration_lease.py
      - name: Extend matching active lease up to 10 minutes after CI event
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/renew_integration_lease.py
