name: Import Android source and build demo APK
on:
  push:
    branches: [main]
    paths: ['.github/import-ready.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: source-import-${{ github.ref }}
  cancel-in-progress: false
jobs:
  import-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore provided Android source
        shell: bash
        run: |
          set -euo pipefail
          cat .github/source-parts/part-*.txt | base64 -d | tar -xz -C .
          rm -rf .github/source-parts .github/import-ready.txt
          sed -i '/if: ${{ github.event.repository.private == false }}/d' .github/workflows/android-demo.yml
          chmod +x gradlew
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0' 'platform-tools'
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore original Gradle wrapper
        shell: bash
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          git checkout -- gradle/wrapper/gradle-wrapper.properties
      - name: Commit project files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import full Android demo source from user archive"
          git push origin HEAD:main
      - name: Build installable debug APK
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ernaehrungsgedaechtnis-Demo-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
      - name: Run Android lint and unit tests
        run: ./gradlew --no-daemon --max-workers=2 :app:lintDebug :app:testDebugUnitTest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-demo-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 1
