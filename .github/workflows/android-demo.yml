name: Android checks and optional APK
on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'APK für einen ausgewählten Meilenstein bauen und zum Download bereitstellen'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths: ['app/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'gradlew*', '.github/workflows/android-demo.yml']
  pull_request:
    paths: ['app/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'gradlew*', '.github/workflows/android-demo.yml']
permissions:
  contents: read
concurrency:
  group: android-demo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # Private repositories use the GitHub Actions included-minute allowance.
    # A normal Linux runner and a 20-minute job limit are used.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle.kts
            gradle.properties
            gradle/wrapper/gradle-wrapper.properties
      - name: Set up Android SDK and required packages
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
      - name: Run lint and unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 --continue :app:lintDebug :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin
      - name: Verify fresh JUnit XML and migration regression counts
        run: python3 tools/check_junit_xml.py app/build/test-results/testDebugUnitTest

      - name: Verify pinned product-data historical price parity fixtures
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/eg-product-history-core.py" \
            https://raw.githubusercontent.com/ecora2003-max/EG-Produktdaten/1f85b17ad5a112e8aa9cc91c13b0dff4064f5f37/eg_productdaten/core.py
          python3 tools/check_product_price_memory_reference.py "$RUNNER_TEMP/eg-product-history-core.py" app/src/test/resources/integration/historical_paid_v1.tsv
      - name: Verify pinned product-data Python reference parity fixtures
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 30 \
            https://raw.githubusercontent.com/ecora2003-max/EG-Produktdaten/1f85b17ad5a112e8aa9cc91c13b0dff4064f5f37/eg_productdaten/core.py \
            -o "$RUNNER_TEMP/eg-product-core.py"
          python3 tools/check_product_receipt_reference.py "$RUNNER_TEMP/eg-product-core.py" \
            app/src/test/resources/integration/product_receipt_v1.tsv
      - name: Verify pinned shopping unit-rate Python reference parity
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 30 \
            https://raw.githubusercontent.com/ecora2003-max/EG-Einkaufsintelligenz/a3e13b147124ad7c25698a695e2ab42d7299a58a/eg_shopping/engine.py \
            -o "$RUNNER_TEMP/eg-shopping-engine.py"
          python3 tools/check_shopping_unit_rate_reference.py "$RUNNER_TEMP/eg-shopping-engine.py" \
            app/src/test/resources/integration/shopping_unit_rate_v1.tsv
      - name: Verify pinned shopping validity and store-scope Python parity
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 30 \
            https://raw.githubusercontent.com/ecora2003-max/EG-Einkaufsintelligenz/a3e13b147124ad7c25698a695e2ab42d7299a58a/eg_shopping/engine.py \
            -o "$RUNNER_TEMP/eg-shopping-validity-engine.py"
          python3 tools/check_shopping_validity_reference.py "$RUNNER_TEMP/eg-shopping-validity-engine.py" \
            app/src/test/resources/integration/shopping_validity_v1.tsv
      - name: Verify pinned shopping comparability Python parity
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 30 \
            https://raw.githubusercontent.com/ecora2003-max/EG-Einkaufsintelligenz/a3e13b147124ad7c25698a695e2ab42d7299a58a/eg_shopping/engine.py \
            -o "$RUNNER_TEMP/eg-shopping-comparability-engine.py"
          python3 tools/check_shopping_comparability_reference.py "$RUNNER_TEMP/eg-shopping-comparability-engine.py" \
            app/src/test/resources/integration/shopping_comparability_v1.tsv
      - name: Verify pinned shopping coverage Python reference parity
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 30 \
            https://raw.githubusercontent.com/ecora2003-max/EG-Einkaufsintelligenz/a3e13b147124ad7c25698a695e2ab42d7299a58a/eg_shopping/engine.py \
            -o "$RUNNER_TEMP/eg-shopping-coverage-engine.py"
          python3 tools/check_shopping_coverage_reference.py "$RUNNER_TEMP/eg-shopping-coverage-engine.py" \
            app/src/test/resources/integration/shopping_coverage_signals_v1.tsv
      - name: Verify pinned full shopping compare_prices Python-Kotlin vectors
        run: |
          mkdir -p "$RUNNER_TEMP/eg-shopping-full/eg_shopping" "$RUNNER_TEMP/eg-shopping-full/policies"
          touch "$RUNNER_TEMP/eg-shopping-full/eg_shopping/__init__.py"
          for file in engine.py source_policy.py; do
            curl --fail --location --silent --show-error --retry 2 --max-time 30 \
              "https://raw.githubusercontent.com/ecora2003-max/EG-Einkaufsintelligenz/a3e13b147124ad7c25698a695e2ab42d7299a58a/eg_shopping/$file" \
              -o "$RUNNER_TEMP/eg-shopping-full/eg_shopping/$file"
          done
          curl --fail --location --silent --show-error --retry 2 --max-time 30 \
            https://raw.githubusercontent.com/ecora2003-max/EG-Einkaufsintelligenz/a3e13b147124ad7c25698a695e2ab42d7299a58a/policies/retailer-source-capabilities.v1.json \
            -o "$RUNNER_TEMP/eg-shopping-full/policies/retailer-source-capabilities.v1.json"
          PYTHONPATH="$RUNNER_TEMP/eg-shopping-full" python3 \
            tools/check_shopping_full_compare_reference.py \
            app/src/test/resources/integration/shopping_full_compare_v1.tsv
      - name: Verify pinned shopping FEFO and needs Python-Kotlin vectors
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 30 \
            https://raw.githubusercontent.com/ecora2003-max/EG-Einkaufsintelligenz/a3e13b147124ad7c25698a695e2ab42d7299a58a/eg_shopping/engine.py \
            -o "$RUNNER_TEMP/eg-shopping-needs-engine.py"
          python3 tools/check_shopping_needs_reference.py "$RUNNER_TEMP/eg-shopping-needs-engine.py" \
            app/src/test/resources/integration/shopping_needs_v1.tsv
      - name: Verify pinned full package-mix Python-Kotlin vectors
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 30 \
            https://raw.githubusercontent.com/ecora2003-max/EG-Einkaufsintelligenz/a3e13b147124ad7c25698a695e2ab42d7299a58a/eg_shopping/pack_optimizer.py \
            -o "$RUNNER_TEMP/eg-shopping-pack-optimizer.py"
          python3 tools/check_shopping_pack_mix_reference.py "$RUNNER_TEMP/eg-shopping-pack-optimizer.py" \
            app/src/test/resources/integration/shopping_pack_mix_v1.tsv
      - name: Verify pinned full suggest_purchases Python-Kotlin bounded vectors
        run: |
          mkdir -p "$RUNNER_TEMP/eg-shopping-suggest/eg_shopping" "$RUNNER_TEMP/eg-shopping-suggest/policies"
          touch "$RUNNER_TEMP/eg-shopping-suggest/eg_shopping/__init__.py"
          for file in engine.py source_policy.py pack_optimizer.py; do
            curl --fail --location --silent --show-error --retry 2 --max-time 30 \
              "https://raw.githubusercontent.com/ecora2003-max/EG-Einkaufsintelligenz/a3e13b147124ad7c25698a695e2ab42d7299a58a/eg_shopping/$file" \
              -o "$RUNNER_TEMP/eg-shopping-suggest/eg_shopping/$file"
          done
          curl --fail --location --silent --show-error --retry 2 --max-time 30 \
            https://raw.githubusercontent.com/ecora2003-max/EG-Einkaufsintelligenz/a3e13b147124ad7c25698a695e2ab42d7299a58a/policies/retailer-source-capabilities.v1.json \
            -o "$RUNNER_TEMP/eg-shopping-suggest/policies/retailer-source-capabilities.v1.json"
          PYTHONPATH="$RUNNER_TEMP/eg-shopping-suggest" python3 \
            tools/check_shopping_suggest_reference.py \
            app/src/test/resources/integration/shopping_suggest_v1.tsv
      - name: Verify versioned Room schema
        run: |
          git diff --exit-code -- app/schemas/
          test -z "$(git status --porcelain -- app/schemas/)"
      - name: Build milestone APK
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.build_apk }}
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug
      - name: Upload milestone APK
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.build_apk }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ernaehrungsgedaechtnis-Demo-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Android-demo-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/test-results/testDebugUnitTest/*.xml
            app/schemas/de.ernaehrung.demo.data.local.FoodDatabase/8.json
          if-no-files-found: ignore
          retention-days: 7
