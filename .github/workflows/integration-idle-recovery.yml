name: Integration lock recovery (30 minutes)

on:
  pull_request:
    paths:
      - "tools/integration_idle_recovery.py"
      - "tools/test_integration_idle_recovery.py"
      - "tools/integration_parallel_lock_recovery.py"
      - "tools/integration_codex_lock.py"
      - "tools/test_integration_codex_lock.py"
      - "tools/test_integration_parallel_locks.py"
      - "integration-lock-A.json"
      - "integration-lock-B.json"
      - "integration-merge-lock.json"
      - "integration-lock.json"
      - ".github/workflows/integration-idle-recovery.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-idle-recovery
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify standalone JSON lock and recovery tests
        run: |
          python3 -m unittest discover -s tools -p "test_integration_idle_recovery.py" -v
          python3 -m unittest discover -s tools -p "test_integration_parallel_locks.py" -v
          python3 -m unittest discover -s tools -p "test_integration_codex_lock.py" -v

  recover:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      actions: read
      pull-requests: read
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore stale or conservatively recoverable lock
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/integration_parallel_lock_recovery.py --repo "$GITHUB_REPOSITORY"
